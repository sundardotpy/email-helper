<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ops Dashboard - Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0b0c] text-gray-200 flex items-center justify-center min-h-screen">
    <div class="bg-[#121214] p-8 rounded-xl shadow-2xl border border-zinc-800 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white tracking-wide">Ops<span class="text-[#05a54b]">Dashboard</span></h1>
            <p class="text-zinc-400 text-sm mt-2">Log in or create a local account to begin</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-3 mb-4 text-sm rounded bg-zinc-800 border-l-4 border-{% if category=='error' %}red-500{% else %}[#05a54b]{% endif %} text-white">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Username</label>
                <input type="text" name="username" required class="w-full bg-[#1a1a1e] border border-zinc-700 rounded-lg p-3 text-white focus:outline-none focus:border-[#05a54b]">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Password</label>
                <input type="password" name="password" required class="w-full bg-[#1a1a1e] border border-zinc-700 rounded-lg p-3 text-white focus:outline-none focus:border-[#05a54b]">
            </div>
            <div class="flex space-x-3 pt-2">
                <button type="submit" class="w-1/2 bg-[#05a54b] hover:bg-[#04883d] text-white font-medium py-3 rounded-lg transition duration-200">Sign In</button>
                <button type="submit" formaction="/register" class="w-1/2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium py-3 rounded-lg transition duration-200">Sign Up</button>
            </div>
        </form>
    </div>
</body>
</html>
